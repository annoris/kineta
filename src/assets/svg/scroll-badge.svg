  </defs>
  <!-- Acid Chartreuse circular stamp -->
  <circle cx="54" cy="54" r="52" fill="#D8FF00" stroke="#111111" stroke-width="2"/>
  <circle cx="54" cy="54" r="26" fill="none" stroke="#111111" stroke-width="1.5"/>

